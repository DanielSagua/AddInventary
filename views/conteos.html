<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <title>AddInventary - Conteos</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="/css/styles.css" />

    <style>
        .section-title {
            color: #005387;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .hidden {
            display: none;
        }

        .table thead {
            background: #005387;
            color: white;
        }

        .pill {
            padding: 4px 10px;
            border-radius: 6px;
            color: white;
            font-size: 12px;
        }

        .pill-abierto {
            background-color: #0d6efd;
        }

        .pill-cerrado {
            background-color: #198754;
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="/home">AddInventary</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="/productos">Productos</a></li>
                    <li class="nav-item"><a class="nav-link" href="/stock">Stock</a></li>
                    <li class="nav-item"><a class="nav-link" href="/movimientos">Movimientos</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/conteos">Conteos</a></li>
                </ul>

                <a href="/logout" class="btn btn-outline-light btn-sm">Cerrar sesión</a>
            </div>
        </div>
    </nav>

    <div class="container py-4">

        <div id="alertConteos" class="mb-3"></div>


        <!-- ============================
              SECCIÓN 1: CREAR CONTEO
        ============================== -->
        <div class="mb-4">
            <h4 class="section-title">Crear conteo</h4>

            <div class="card border-0 shadow-sm">
                <div class="card-body">
                    <div class="row g-3">

                        <div class="col-md-4">
                            <label class="form-label">Bodega</label>
                            <select id="cbBodega" class="form-select"></select>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label">Tipo de conteo</label>
                            <select id="cbTipoConteo" class="form-select">
                                <option value="general">General</option>
                                <option value="ciclico">Cíclico</option>
                                <option value="verificacion">Verificación</option>
                            </select>
                        </div>

                        <div class="col-md-12">
                            <label class="form-label">Observaciones</label>
                            <textarea id="txtObsConteo" class="form-control" rows="2"></textarea>
                        </div>

                        <div class="col-12 text-end">
                            <button class="btn btn-primary" id="btnCrearConteo">Crear conteo</button>
                        </div>

                    </div>
                </div>
            </div>
        </div>


        <!-- ============================
              SECCIÓN 2: LISTA DE CONTEOS
        ============================== -->
        <div class="mb-5">
            <h4 class="section-title">Conteos realizados</h4>

            <table class="table table-bordered table-sm shadow-sm">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Fecha</th>
                        <th>Bodega</th>
                        <th>Tipo</th>
                        <th>Estado</th>
                        <th>Usuario</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="tablaConteos"></tbody>
            </table>
        </div>


        <!-- ============================
              SECCIÓN 3: INGRESAR DETALLE
        ============================== -->
        <div id="seccionDetalle" class="hidden">

            <h4 class="section-title">Detalle del conteo</h4>

            <div class="card border-0 shadow-sm mb-3">
                <div class="card-body">

                    <div class="row g-3">

                        <div class="col-md-4">
                            <label class="form-label">Producto (código de barra)</label>
                            <input type="text" id="txtCodigo" class="form-control" autocomplete="off"
                                placeholder="Escanee o escriba el código" />
                        </div>

                        <div class="col-md-3">
                            <label class="form-label">Ubicación</label>
                            <select id="cbUbicacion" class="form-select"></select>
                        </div>

                        <div class="col-md-3">
                            <label class="form-label">Cantidad contada</label>
                            <input type="number" id="txtCantidad" class="form-control" step="0.01" />
                        </div>

                        <div class="col-md-2 d-flex align-items-end">
                            <button class="btn btn-success w-100" id="btnRegistrarLinea">
                                Registrar
                            </button>
                        </div>

                    </div>

                </div>
            </div>


            <!-- TABLA DETALLE -->
            <div class="card border-0 shadow-sm">
                <div class="card-body">

                    <table class="table table-bordered table-sm">
                        <thead>
                            <tr>
                                <th>Producto</th>
                                <th>Sistema</th>
                                <th>Contado</th>
                                <th>Diferencia</th>
                                <th>Ubicación</th>
                            </tr>
                        </thead>
                        <tbody id="tablaDetalle"></tbody>
                    </table>

                    <div class="text-end mt-3">
                        <button class="btn btn-danger" id="btnCerrarConteo">
                            Cerrar conteo
                        </button>
                    </div>

                </div>
            </div>

        </div>

    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/conteos.js"></script>

</body>

</html>
