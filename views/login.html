<!-- views/login.html -->
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <title>AddInventary - Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Bootstrap 5.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="/css/styles.css" />
</head>

<body>
    <div class="login-container">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-5 col-lg-4">
                    <div class="card card-login p-4 p-md-5">
                        <div class="text-center mb-3">
                            <div class="logo-circle">
                                <span>AI</span>
                            </div>
                            <h5 class="mb-0 fw-bold" style="color:#005387;">
                                AddInventary
                            </h5>
                            <small class="text-muted">Gestión corporativa de inventario</small>
                        </div>

                        <!-- Mensajes de error (opcionalmente se rellenan desde JS) -->
                        <div id="alert-placeholder"></div>

                        <form action="/login" method="POST" id="loginForm" novalidate>
                            <div class="mb-3">
                                <label for="usuario" class="form-label">Usuario</label>
                                <label for="usuario" class="form-label">Usuario</label>
                                <input type="text" class="form-control" id="usuario" name="usuario" required />

                                <div class="invalid-feedback">
                                    Ingresa un usuario válido.
                                </div>
                            </div>

                            <div class="mb-2">
                                <label for="password" class="form-label">Contraseña</label>
                                <input type="password" class="form-control" id="password" name="password" required
                                    minlength="4" />
                                <div class="invalid-feedback">
                                    Ingresa tu contraseña.
                                </div>
                            </div>

                            <div class="d-flex justify-content-between align-items-center mb-3">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" value="" id="rememberMe">
                                    <label class="form-check-label" for="rememberMe">
                                        Recordarme
                                    </label>
                                </div>
                                <a href="#" class="small">¿Olvidaste tu contraseña?</a>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 mb-2">
                                Ingresar
                            </button>

                            <p className="text-center text-muted mb-0" style="font-size: 0.8rem;">
                                © <span id="year"></span> WEG Chile · AddInventary
                            </p>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/login.js"></script>
</body>

</html>
