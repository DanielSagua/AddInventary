<!-- views/productos.html -->
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <title>AddInventary - Productos</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="/css/styles.css" />
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="/home">
                AddInventary
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="/productos">Productos</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/home">Inicio</a>
                    </li>
                    <!-- Aquí después agregas Stock, Movimientos, etc. -->
                </ul>
                <div class="d-flex align-items-center gap-2">
                    <span class="navbar-text small d-none d-md-inline">
                        Sesión activa
                    </span>
                    <a href="/logout" class="btn btn-outline-light btn-sm">
                        Cerrar sesión
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <main class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <div>
                <h4 class="fw-bold" style="color:#005387;">Productos</h4>
                <p class="text-muted mb-0">
                    Administración de productos, códigos de barra y unidades.
                </p>
            </div>
            <button class="btn btn-primary" id="btnNuevoProducto">
                + Nuevo producto
            </button>
        </div>

        <div id="alertaProductos"></div>

        <div class="card border-0 shadow-sm">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-sm align-middle mb-0" id="tablaProductos">
                        <thead class="table-light">
                            <tr>
                                <th>Código barra</th>
                                <th>SKU</th>
                                <th>Nombre</th>
                                <th>Marca</th>
                                <th>Categoría</th>
                                <th>Unidad De Medida</th>
                                <th>Contenido Por Envase</th>
                                <th class="text-end">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tablaProductosBody">
                            <!-- Se rellena por JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <!-- Modal: Nuevo producto -->
    <div class="modal fade" id="modalProductoAdd" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content">
                <form id="formProductoAdd" novalidate>
                    <div class="modal-header">
                        <h5 class="modal-title">Nuevo producto</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">

                        <div class="row g-3">
                            <div class="col-md-4">
                                <label for="add_codigo_barra" class="form-label">Código de barra</label>
                                <input type="text" class="form-control" id="add_codigo_barra" name="codigo_barra"
                                    autocomplete="off" required />
                                <div class="form-text">
                                    Enfoca aquí y escanea con la pistola.
                                </div>
                            </div>

                            <div class="col-md-4">
                                <label for="add_sku" class="form-label">SKU</label>
                                <input type="text" class="form-control" id="add_sku" name="sku" />
                            </div>

                            <div class="col-md-4">
                                <label for="add_nombre" class="form-label">Nombre</label>
                                <input type="text" class="form-control" id="add_nombre" name="nombre" required />
                            </div>

                            <div class="col-12">
                                <label for="add_descripcion" class="form-label">Descripción</label>
                                <textarea class="form-control" id="add_descripcion" name="descripcion"
                                    rows="2"></textarea>
                            </div>

                            <div class="col-md-4">
                                <label for="add_marca" class="form-label">Marca</label>
                                <input type="text" class="form-control" id="add_marca" name="marca" />
                            </div>

                            <div class="col-md-4">
                                <label for="add_categoria" class="form-label">Categoría</label>
                                <input type="text" class="form-control" id="add_categoria" name="categoria" />
                            </div>

                            <div class="col-md-2">
                                <label for="add_unidad_medida" class="form-label">Unidad</label>
                                <input type="text" class="form-control" id="add_unidad_medida" name="unidad_medida"
                                    placeholder="ej: lt, kg" />
                            </div>

                            <div class="col-md-2">
                                <label for="add_contenido_neto" class="form-label">Contenido</label>
                                <input type="text" class="form-control" id="add_contenido_neto" name="contenido_neto"
                                    placeholder="ej: 1, 500" />
                            </div>
                        </div>

                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">
                            Cancelar
                        </button>
                        <button type="submit" class="btn btn-primary">
                            Guardar
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Modal: Editar producto -->
    <div class="modal fade" id="modalProductoEdit" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content">
                <form id="formProductoEdit" novalidate>
                    <div class="modal-header">
                        <h5 class="modal-title">Editar producto</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <input type="hidden" id="edit_id_producto" name="id_producto" />

                        <div class="row g-3">
                            <div class="col-md-4">
                                <label for="edit_codigo_barra" class="form-label">Código de barra</label>
                                <input type="text" class="form-control" id="edit_codigo_barra" name="codigo_barra"
                                    autocomplete="off" required />
                            </div>

                            <div class="col-md-4">
                                <label for="edit_sku" class="form-label">SKU</label>
                                <input type="text" class="form-control" id="edit_sku" name="sku" />
                            </div>

                            <div class="col-md-4">
                                <label for="edit_nombre" class="form-label">Nombre</label>
                                <input type="text" class="form-control" id="edit_nombre" name="nombre" required />
                            </div>

                            <div class="col-12">
                                <label for="edit_descripcion" class="form-label">Descripción</label>
                                <textarea class="form-control" id="edit_descripcion" name="descripcion"
                                    rows="2"></textarea>
                            </div>

                            <div class="col-md-4">
                                <label for="edit_marca" class="form-label">Marca</label>
                                <input type="text" class="form-control" id="edit_marca" name="marca" />
                            </div>

                            <div class="col-md-4">
                                <label for="edit_categoria" class="form-label">Categoría</label>
                                <input type="text" class="form-control" id="edit_categoria" name="categoria" />
                            </div>

                            <div class="col-md-2">
                                <label for="edit_unidad_medida" class="form-label">Unidad</label>
                                <input type="text" class="form-control" id="edit_unidad_medida" name="unidad_medida" />
                            </div>

                            <div class="col-md-2">
                                <label for="edit_contenido_neto" class="form-label">Contenido</label>
                                <input type="text" class="form-control" id="edit_contenido_neto"
                                    name="contenido_neto" />
                            </div>
                        </div>

                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">
                            Cancelar
                        </button>
                        <button type="submit" class="btn btn-primary">
                            Actualizar
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/productos.js"></script>
</body>

</html>
