<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <title>AddInventary - Stock</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="/css/styles.css" />
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="/home">AddInventary</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navStock">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navStock">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">

                    <li class="nav-item">
                        <a class="nav-link" href="/productos">Productos</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" href="/stock">Stock</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="/movimientos">Movimientos</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="/conteos">Conteos</a>
                    </li>

                </ul>

                <a href="/logout" class="btn btn-outline-light btn-sm">Cerrar sesión</a>
            </div>
        </div>
    </nav>

    <main class="container py-4">

        <h4 class="fw-bold" style="color:#005387;">Stock por bodega</h4>
        <p class="text-muted">Visualización del stock por producto y bodega.</p>

        <div id="alertaStock"></div>

        <div class="card border-0 shadow-sm">
            <div class="card-body">

                <div class="table-responsive">
                    <table class="table table-sm align-middle mb-0" id="tablaStock">
                        <thead class="table-light">
                            <tr>
                                <th>Barra</th>
                                <th>SKU</th>
                                <th>Producto</th>
                                <th>Bodega</th>
                                <th>Ubicación</th>
                                <th class="text-end">Cantidad</th>
                                <th class="text-end">Mínimo</th>
                                <th class="text-end">Máximo</th>
                                <th class="text-end">Estado</th>
                                <th class="text-end">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tablaStockBody">
                            <!-- Rellenado por JS -->
                        </tbody>
                    </table>
                </div>

            </div>
        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/stock.js"></script>
</body>

</html>
