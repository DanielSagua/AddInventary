<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <title>AddInventary - Usuarios</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="/css/styles.css" />

    <style>
        .section-title {
            color: #005387;
            font-weight: bold;
        }

        .table thead {
            background: #005387;
            color: white;
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="/home">AddInventary</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">

                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="/productos">Productos</a></li>
                    <li class="nav-item"><a class="nav-link" href="/stock">Stock</a></li>
                    <li class="nav-item"><a class="nav-link" href="/movimientos">Movimientos</a></li>
                    <li class="nav-item"><a class="nav-link" href="/conteos">Conteos</a></li>
                    <li class="nav-item"><a class="nav-link" href="/reportes">Reportes</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/usuarios">Usuarios</a></li>
                </ul>

                <a href="/logout" class="btn btn-outline-light btn-sm">Cerrar sesión</a>
            </div>
        </div>
    </nav>


    <div class="container py-4">

        <h3 class="section-title mb-3">Administración de Usuarios</h3>

        <div class="text-end mb-3">
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalCrear">
                + Agregar usuario
            </button>
        </div>

        <table class="table table-bordered table-sm shadow-sm">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Usuario</th>
                    <th>Rol</th>
                    <th>Estado</th>
                    <th></th>
                </tr>
            </thead>
            <tbody id="tablaUsuarios"></tbody>
        </table>
    </div>


    <!-- ======================================
              MODAL CREAR USUARIO
    ======================================= -->
    <div class="modal fade" id="modalCrear" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">

                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title">Crear usuario</h5>
                    <button class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">

                    <div class="mb-3">
                        <label class="form-label">Nombre completo</label>
                        <input type="text" id="crearNombre" class="form-control">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Usuario</label>
                        <input type="text" id="crearUsuario" class="form-control">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Contraseña</label>
                        <input type="password" id="crearClave" class="form-control">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Rol</label>
                        <select id="crearRol" class="form-select">
                            <option value="admin">Admin</option>
                            <option value="bodega">Bodega</option>
                            <option value="consulta">Consulta</option>
                        </select>
                    </div>

                </div>

                <div class="modal-footer">
                    <button class="btn btn-success" id="btnCrearUsuario">Guardar</button>
                </div>

            </div>
        </div>
    </div>



    <!-- ======================================
              MODAL EDITAR USUARIO
    ======================================= -->
    <div class="modal fade" id="modalEditar" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">

                <div class="modal-header bg-warning">
                    <h5 class="modal-title">Editar usuario</h5>
                    <button class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">

                    <input type="hidden" id="editId">

                    <div class="mb-3">
                        <label class="form-label">Nombre completo</label>
                        <input type="text" id="editNombre" class="form-control">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Usuario</label>
                        <input type="text" id="editUsuarioDisabled" class="form-control" disabled>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Rol</label>
                        <select id="editRol" class="form-select">
                            <option value="admin">Admin</option>
                            <option value="bodega">Bodega</option>
                            <option value="consulta">Consulta</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Estado</label>
                        <select id="editEstado" class="form-select">
                            <option value="activo">Activo</option>
                            <option value="inactivo">Inactivo</option>
                        </select>
                    </div>

                    <hr>

                    <div class="mb-3">
                        <label class="form-label">Nueva contraseña (opcional)</label>
                        <input type="password" id="editClave" class="form-control"
                            placeholder="Dejar vacío para no cambiar">
                    </div>

                </div>

                <div class="modal-footer">
                    <button class="btn btn-success" id="btnActualizarUsuario">Actualizar</button>
                </div>

            </div>
        </div>
    </div>


    <!-- ======================================
              MODAL RESETEAR CONTRASEÑA
    ======================================= -->
    <div class="modal fade" id="modalClave" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">

                <div class="modal-header bg-danger text-white">
                    <h5 class="modal-title">Resetear contraseña</h5>
                    <button class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">
                    <input type="hidden" id="resetId">

                    <div class="mb-3">
                        <label class="form-label">Nueva contraseña</label>
                        <input type="password" id="resetClave" class="form-control">
                    </div>
                </div>

                <div class="modal-footer">
                    <button class="btn btn-danger" id="btnResetClave">Guardar nueva contraseña</button>
                </div>

            </div>
        </div>
    </div>



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/usuarios.js"></script>

</body>

</html>
